<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodeLearner · part of CodeBay</title>
<meta name="description" content="Learn to code from zero to world-class: interactive lessons, career roadmaps, a coding-problem judge and step-by-step bootcamps, all in your browser.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* CodeLearner design system.
   Ground: deep ink (dark) or cool paper (light). One aurora gradient (violet → cyan → lime) carries brand moments;
   status colours stay semantic: green = done/easy, amber = exam/medium, rose = hard/error. */
:root{
  --bg:#f5f6fb; --bg2:#eceefa; --surface:#ffffff; --surface2:#f8f9fe; --sunk:#eaecf6; --ink:#0e1330; --muted:#596187; --line:#e0e3f1; --line2:#cfd4ea;
  --accent:#5b45f0; --accent-2:#0891b2; --accent-3:#4d7c0f; --accent-soft:#ebe8ff; --on-accent:#ffffff;
  --hot:#e11d74; --hot-soft:#fde4ef;
  --summit:#b45309; --summit-soft:#fdf0dc; --ok:#047857; --ok-soft:#dcf5ea; --bad:#c62828; --bad-soft:#fde4e4;
  --easy:#0f8a6a; --med:#b86e00; --hard:#d02a55;
  --code-bg:#f7f8fd;
  --grad:linear-gradient(120deg,#6d5cff 0%,#22b8d8 52%,#7cc22a 100%);
  --grad-soft:linear-gradient(120deg,rgba(109,92,255,.14),rgba(34,184,216,.12) 55%,rgba(124,194,42,.10));
  --glow:0 10px 40px -12px rgba(91,69,240,.35);
  --shadow:0 1px 2px rgba(14,19,48,.05),0 8px 28px -12px rgba(14,19,48,.14);
  --glass:rgba(255,255,255,.72);
  --syn-kw:#8a2bb8; --syn-str:#1a7f37; --syn-num:#b35900; --syn-com:#6b7785; --syn-def:#4733d6; --syn-bi:#0f6f8c; --syn-err:#c62828; --cursor:#0e1330; --sel:#d9d3ff;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060812; --bg2:#0a0e1d; --surface:#0e1324; --surface2:#121831; --sunk:#151b33; --ink:#e9ecff; --muted:#8e97c0; --line:#1d2543; --line2:#2a3460;
  --accent:#8b7dff; --accent-2:#38d3f0; --accent-3:#a3e635; --accent-soft:#1d1a46; --on-accent:#0a0b1a;
  --hot:#ff5c93; --hot-soft:#3a1229;
  --summit:#fbbf24; --summit-soft:#33260b; --ok:#34d399; --ok-soft:#0c2c22; --bad:#ff7a7a; --bad-soft:#3a1418;
  --easy:#2dd4a7; --med:#fbbf24; --hard:#ff5c86;
  --code-bg:#0a0f1f;
  --grad:linear-gradient(120deg,#8b7dff 0%,#38d3f0 52%,#a3e635 100%);
  --grad-soft:linear-gradient(120deg,rgba(139,125,255,.16),rgba(56,211,240,.10) 55%,rgba(163,230,53,.08));
  --glow:0 10px 50px -10px rgba(139,125,255,.45);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 40px -18px rgba(0,0,0,.8);
  --glass:rgba(10,14,29,.66);
  --syn-kw:#d39bff; --syn-str:#7ee2a8; --syn-num:#ffb36b; --syn-com:#7883a8; --syn-def:#a99dff; --syn-bi:#6fd3ee; --syn-err:#ff7a7a; --cursor:#e9ecff; --sel:#2c2a63;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060812; --bg2:#0a0e1d; --surface:#0e1324; --surface2:#121831; --sunk:#151b33; --ink:#e9ecff; --muted:#8e97c0; --line:#1d2543; --line2:#2a3460;
  --accent:#8b7dff; --accent-2:#38d3f0; --accent-3:#a3e635; --accent-soft:#1d1a46; --on-accent:#0a0b1a;
  --hot:#ff5c93; --hot-soft:#3a1229;
  --summit:#fbbf24; --summit-soft:#33260b; --ok:#34d399; --ok-soft:#0c2c22; --bad:#ff7a7a; --bad-soft:#3a1418;
  --easy:#2dd4a7; --med:#fbbf24; --hard:#ff5c86;
  --code-bg:#0a0f1f;
  --grad:linear-gradient(120deg,#8b7dff 0%,#38d3f0 52%,#a3e635 100%);
  --grad-soft:linear-gradient(120deg,rgba(139,125,255,.16),rgba(56,211,240,.10) 55%,rgba(163,230,53,.08));
  --glow:0 10px 50px -10px rgba(139,125,255,.45);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 40px -18px rgba(0,0,0,.8);
  --glass:rgba(10,14,29,.66);
  --syn-kw:#d39bff; --syn-str:#7ee2a8; --syn-num:#ffb36b; --syn-com:#7883a8; --syn-def:#a99dff; --syn-bi:#6fd3ee; --syn-err:#ff7a7a; --cursor:#e9ecff; --sel:#2c2a63;
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
code,pre,.CodeMirror,textarea,.pred{font-variant-ligatures:none} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(1100px 520px at 12% -8%,color-mix(in oklab,var(--accent) 16%,transparent),transparent 62%),
             radial-gradient(900px 460px at 100% 0%,color-mix(in oklab,var(--accent-2) 11%,transparent),transparent 60%),
             radial-gradient(800px 600px at 50% 120%,color-mix(in oklab,var(--accent-3) 6%,transparent),transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 30%,transparent 75%)}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in oklab,var(--accent) 35%,transparent)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:80px}
code{font:0.86em var(--mono);background:var(--sunk);padding:1.5px 6px;border-radius:6px;border:1px solid var(--line)}
h1,h2,h3,h4{text-wrap:balance}
p{text-wrap:pretty}
.eyebrow{font:600 11.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.lg{width:24px;height:24px} .ic.xl{width:30px;height:30px} .ic.sm{width:15px;height:15px;vertical-align:-2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1320px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px}
.logo{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font:800 1.18rem/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow);color:#0a0b1a}
.logo .mk svg{width:19px;height:19px;stroke:#0a0b1a;stroke-width:2.4}
.logo .lt{display:grid;gap:3px}
.brand{position:relative;display:flex;flex-shrink:0}
.logo small,.brand .by{font:600 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.logo small{visibility:hidden}
.brand .by{position:absolute;left:42px;bottom:0;text-decoration:none}
.brand .by:hover{color:var(--ink);text-decoration:underline}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:10px;font:500 14px var(--body);color:var(--muted);position:relative;white-space:nowrap;transition:color .15s,background .15s}
.tabs button:hover{color:var(--ink);background:var(--sunk)}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2px;border-radius:2px;background:var(--grad)}
.tabs button[aria-current="page"] .ic{color:var(--accent)}
.tabs .badge{font:600 10px var(--mono);background:var(--hot);color:#fff;border-radius:99px;padding:1px 6px;margin-left:2px}
.top-r{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.kbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px var(--body)}
.kbtn:hover{border-color:var(--line2);color:var(--ink)}
kbd{font:600 10.5px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.chipx{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--mono);white-space:nowrap}
.chipx:hover{border-color:var(--line2)}
.chipx.fire{color:#ff8a3d} .chipx.fire .ic{fill:color-mix(in oklab,#ff8a3d 35%,transparent)}
.chipx.coin{color:var(--med)} .chipx.coin .coin{width:16px;height:16px}
svg.coin{width:1em;height:1em;flex:none;fill:color-mix(in oklab,#fbbf24 30%,transparent);stroke:#d99a06;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.chipx.xp .lv{all:unset;font:700 11px var(--mono);background:var(--grad);color:#0a0b1a;border-radius:99px;padding:2px 7px}
.iconbtn{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.sync{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--ok)}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:grid;z-index:40}
.menu button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;font:500 14px var(--body)}
.menu button:hover,.menu button[aria-current="page"]{background:var(--sunk)}
.acct{position:relative}
.acctbtn{all:unset;cursor:pointer;height:36px;min-width:36px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--body);color:var(--ink);white-space:nowrap}
.acctbtn:hover{border-color:var(--line2)}.acctbtn[hidden]{display:none}
.acctbtn.in{padding:0;width:36px;border-radius:50%;overflow:hidden}.acctbtn img{width:100%;height:100%;object-fit:cover}
.acctbtn .ini{font:700 14px var(--display);color:var(--accent)}
.acctbtn .gg{width:16px;height:16px}
@media (max-width:620px){.acctbtn:not(.in) span{display:none}.acctbtn:not(.in){padding:0;width:36px}}
.acctmenu{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;z-index:40}
.acctmenu[hidden]{display:none}
.acctmenu .who{display:grid;gap:2px}.acctmenu .who span{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.gbtn{all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;height:42px;padding:0 16px;border-radius:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;font:500 14px/1 Roboto,"IBM Plex Sans",system-ui,sans-serif}
.gbtn:hover{background:#f2f2f2}.gbtn .gg{width:18px;height:18px}.gbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover}
.signbar{grid-template-columns:minmax(0,1fr) auto;align-items:center}
@media (max-width:640px){.signbar{grid-template-columns:minmax(0,1fr)}.signbar .gbtn{justify-self:start}}
.wsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.wscard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;display:grid;gap:4px;box-shadow:var(--shadow)}
.wscard .wsopen{all:unset;cursor:pointer;display:grid;gap:6px;padding:12px;border-radius:12px}
.wscard .wsopen:hover{background:var(--sunk)}.wscard .wsopen b{font:700 1.05rem var(--display);overflow-wrap:anywhere}.wscard .wsopen .muted{font-size:.85rem}
.wscard .btn{justify-self:end;margin:0 6px 6px}
.wshead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.wshead .sp{flex:1}
.wsname{all:unset;font:800 clamp(1.4rem,3vw,2rem)/1.2 var(--display);letter-spacing:-.02em;border-bottom:1.5px dashed transparent;min-width:0;max-width:100%}
.wsname:hover,.wsname:focus{border-bottom-color:var(--line2)}
.wslayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.wslayout{grid-template-columns:minmax(0,1fr)}}
.wsfiles{padding:14px;gap:10px}
.wsflist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.wsflist button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;font:500 13px var(--mono);overflow-wrap:anywhere}
.wsflist button:hover{background:var(--sunk)}.wsflist button[aria-current="true"]{background:var(--accent-soft,var(--sunk));color:var(--accent)}
.wsfact{display:flex;flex-wrap:wrap;gap:6px}
.wsaddf{display:flex;gap:6px}.wsaddf .field{padding:6px 8px;font-size:13px}
.wsmain{display:grid;gap:14px;min-width:0}
.wsta{min-height:420px}
.wsmain .CodeMirror{height:auto;min-height:420px}.wsmain .CodeMirror-scroll{min-height:420px;max-height:70vh}
.err{color:var(--bad,#ef4444)}
.top-in.tight .kbtn span,.top-in.tight .kbtn kbd{display:none}
.top-in.tight .kbtn{padding:8px}
.top-in.tight .acctbtn:not(.in) span{display:none}.top-in.tight .acctbtn:not(.in){width:36px;padding:0}
.top-in.tight .chipx.xp .xpn{display:none}
.top-in.snug .chipx.fire,.top-in.tight .chipx.coin span{display:none}.top-in.snug .tabs button{padding:8px 7px;gap:6px}.top-in.snug{gap:10px}
@media (max-width:980px){.kbtn span,.kbtn kbd{display:none}.kbtn{padding:8px}}
.tabs.compact button span:not(.badge){display:none}
.tabs.compact button{padding:8px 10px}
@media (max-width:980px){
  .top-in{flex-wrap:wrap;row-gap:6px}
  .tabs{order:3;flex-basis:100%;margin:0 -4px}
  .tabs button[aria-current="page"]::after{bottom:-7px}
  .top-r{margin-left:auto}
}
@media (max-width:420px){.chipx.fire{display:none}.logo .lt>span{font-size:1.05rem}}

main{padding-top:30px;display:grid;grid-template-columns:minmax(0,1fr);gap:30px;min-width:0}
main>*{min-width:0}
.h1{font:800 clamp(2rem,4.6vw,3.3rem)/1.04 var(--display);letter-spacing:-.03em;margin:0}
.h2{font:700 clamp(1.3rem,2.6vw,1.75rem)/1.15 var(--display);letter-spacing:-.015em;margin:0}
.h3{font:700 1.15rem/1.25 var(--display);margin:0}
.lede{margin:0;max-width:68ch;color:var(--muted);font-size:1.05rem}
.head{display:grid;gap:12px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:14px;align-content:start;min-width:0;box-shadow:var(--shadow)}
.glow{position:relative;isolation:isolate}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in oklab,var(--accent) 80%,transparent),transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glow:hover::before{opacity:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:11px;padding:9px 16px;font:600 14px var(--body);text-decoration:none;color:var(--ink);transition:transform .12s,border-color .15s,background .15s,box-shadow .2s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 6px 20px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 8px 28px -8px var(--accent)}
.btn.grad{background:var(--grad);border-color:transparent;color:#0a0b1a;box-shadow:var(--glow)}
.btn.grad:hover{filter:saturate(1.15) brightness(1.05)}
.btn.exam{background:var(--summit);border-color:transparent;color:#1a1000}
.btn[disabled]{opacity:.45;cursor:default;filter:none;transform:none}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.lg{padding:13px 22px;font-size:15.5px;border-radius:13px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.exam{background:var(--summit-soft);color:var(--summit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.hot{background:var(--hot-soft);color:var(--hot)}
.lv{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid currentColor}
.lv1{color:var(--muted)} .lv2{color:var(--accent)} .lv3{color:var(--summit)}
.diff{font:600 12px var(--mono)} .diff.Easy{color:var(--easy)} .diff.Medium{color:var(--med)} .diff.Hard{color:var(--hard)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* reveal on scroll */
.anim .rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.anim .rv.in{opacity:1;transform:none}

/* ---------- home ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding:34px 0 10px}
@media (max-width:960px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font:800 clamp(2.5rem,6.4vw,4.9rem)/.98 var(--display);letter-spacing:-.04em;margin:0}
.hero .lede{font-size:clamp(1.02rem,1.6vw,1.2rem)}
.badge-line{display:inline-flex;white-space:normal;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--body);color:var(--muted);width:max-content;max-width:100%}

@keyframes tout{to{transform:translateX(30px);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
.pal-bg{position:fixed;inset:0;z-index:70;background:rgba(3,5,15,.55);backdrop-filter:blur(4px);display:grid;justify-items:center;align-items:start;padding:12vh 16px 16px;animation:fade .15s}
.pal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:0 40px 100px -30px rgba(0,0,0,.7);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:70vh}
.pal .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal input{all:unset;flex:1;font:500 16px var(--body);color:var(--ink)}
.pal ul{list-style:none;margin:0;padding:6px;overflow-y:auto}
.pal li button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px}
.pal li button[aria-selected="true"]{background:var(--accent-soft)}
.pal li .pi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sunk);color:var(--accent)}
.pal li .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pal li .sub{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal li .kd{font:600 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pal .ft{padding:8px 14px;border-top:1px solid var(--line);font:500 11.5px var(--mono);color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.pal .grp{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}

/* ---------- existing views (dashboard plan, map, lesson, quiz) ---------- */
.plan{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:p}
.plan li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.plan li::before{counter-increment:p;content:counter(p);font:700 15px var(--mono);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.plan li.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.plan h4{margin:0;font:600 15px var(--body)}
.plan p{margin:0;font-size:.9rem;color:var(--muted)}
@media (max-width:560px){.plan li{grid-template-columns:30px minmax(0,1fr)}.plan li .btn{grid-column:2;justify-self:start}}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--sunk)}
.heat i[data-l="1"]{background:color-mix(in oklab,var(--accent) 30%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in oklab,var(--accent) 55%,var(--sunk))}
.heat i[data-l="3"]{background:color-mix(in oklab,var(--accent) 78%,var(--sunk))}
.heat i[data-l="4"]{background:var(--accent)}
.heat i.today{outline:1.5px solid var(--ink);outline-offset:1px}
.heat53{grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:2px}.heat53 i{width:11px;height:11px;border-radius:3px}
.clockrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.clockrow{grid-template-columns:minmax(0,1fr);gap:10px}}
.clockhero{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:26px}
@media (max-width:640px){.clockhero{grid-template-columns:minmax(0,1fr)}}
.clockbig{display:grid;gap:2px}.clockbig b{font:800 clamp(2.6rem,8vw,4.2rem)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}.clockbig span{font:500 13px var(--mono);color:var(--muted)}
.bar.big{height:14px}
.field{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:14px var(--body);background:var(--surface);color:var(--ink)}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
.mform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.mform label{display:grid;gap:5px;font:600 12px var(--mono);color:var(--muted)}.mform .wide{grid-column:1/-1}
.mform .btn{justify-self:start}
.mlist{list-style:none;margin:0;padding:0;display:grid}.mlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mlist li div{display:grid;gap:2px;min-width:0}.mlist li span{font-size:.84rem;overflow-wrap:anywhere}
.legend{display:flex;gap:4px;align-items:center;font:500 11px var(--mono);color:var(--muted);flex-wrap:wrap}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:500 10px var(--mono);fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart rect.b{fill:var(--accent)}
.chart rect.b.now{fill:var(--summit)}
.chart rect.hit{fill:transparent;cursor:default}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px var(--mono);padding:5px 9px;border-radius:7px;white-space:nowrap}
.mast{display:grid;gap:9px}
.mast .r{display:grid;grid-template-columns:200px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.88rem}
.mast .t{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.mast .t i{display:block;height:100%;background:var(--grad);border-radius:99px}
.mast .n{font:600 11px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.mast .r{grid-template-columns:110px minmax(0,1fr) 40px}}

.ladder{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.ladder button{all:unset;cursor:pointer;flex:0 0 auto;min-width:128px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:5px;transition:border-color .15s,transform .15s}
.ladder button:hover{transform:translateY(-2px)}
.ladder button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--glow)}
.ladder .k{font:600 10px var(--mono);color:var(--muted);letter-spacing:.08em}
.ladder .nm{font:600 13px/1.25 var(--body)}
.ladder .t{height:4px;border-radius:9px;background:var(--sunk);overflow:hidden}
.ladder .t i{display:block;height:100%;background:var(--grad)}
.ladder .lock{opacity:.6}
.stagehead{display:grid;gap:10px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.modules{display:grid;gap:16px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;box-shadow:var(--shadow)}
.mod.locked{background:transparent;border-style:dashed;box-shadow:none}
.mod h3{margin:0;font:700 1.2rem/1.2 var(--display)}
.mod p{margin:0;color:var(--muted);font-size:.92rem}
.mod .side{display:grid;gap:8px;justify-items:end;align-content:start}
@media (max-width:640px){.mod{grid-template-columns:minmax(0,1fr)}.mod .side{justify-items:start}}
.days{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.day{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;padding:7px 12px 7px 7px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:.86rem;max-width:100%;transition:border-color .15s,transform .15s}
.day:hover{border-color:var(--accent);transform:translateY(-1px)}
.day .dn{font:600 11px var(--mono);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.day.done .dn{background:var(--grad);color:#0a0b1a}
.day.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.day.next .dn{background:var(--accent-soft);color:var(--accent)}
.day[aria-disabled="true"]{cursor:default;opacity:.5;transform:none}
.day .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod .proj{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.88rem;border-top:1px solid var(--line);padding-top:12px}
.minibar{width:90px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle}
.minibar i{display:block;height:100%;background:var(--grad)}

.crumbs{font:500 13px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs button{all:unset;cursor:pointer;color:var(--accent)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:34px;align-items:start}
@media (max-width:900px){.lesson{grid-template-columns:minmax(0,1fr)}}
.lesson article{display:grid;gap:24px;min-width:0}
.lesson aside{position:sticky;top:84px;display:grid;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
@media (max-width:900px){.lesson aside{position:static}}
.objective{background:var(--grad-soft);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-weight:500}
.objective .eyebrow{color:var(--accent);display:block;margin-bottom:4px}
.prose{display:grid;gap:12px;max-width:70ch}
.prose p{margin:0}
.sec{display:grid;gap:12px}
.sec>h3{margin:0;font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
pre.code{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:14px 0;overflow-x:auto;font:13.5px/1.65 var(--mono);counter-reset:ln}
pre.code span.l{display:block;padding:0 16px 0 0;white-space:pre}
pre.code span.l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:36px;padding-right:14px;text-align:right;color:var(--muted);opacity:.6}
pre.code span.l.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tryit{border:1.5px dashed var(--accent);border-radius:14px;padding:16px;display:grid;gap:6px;background:color-mix(in oklab,var(--accent) 4%,transparent)}
.tryit .eyebrow{color:var(--accent)}
textarea.explain{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;font:15px/1.5 var(--body);background:var(--surface);color:var(--ink)}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:.88rem}
.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:8px;width:100%;box-sizing:border-box}
.toc button:hover{background:var(--sunk)}
.toc button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.toc .ck{font:600 11px var(--mono);color:var(--muted)}
.toc .done .ck{color:var(--ok)}
.tutor{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.tout{font-size:.9rem;white-space:pre-wrap;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.tout:empty{display:none}
.why{margin:0;max-width:70ch;font-size:.98rem}
.why b{color:var(--accent)}
.lesson .sec{scroll-margin-top:96px;min-width:0}
.lesson article{grid-template-columns:minmax(0,1fr)}
.tryit,.flow li,.mi,.terms dd,.tklist,.why,.vidmeta{overflow-wrap:anywhere}
.sec.warm{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface2)}
.sec.warm .quiz{box-shadow:none}
textarea.explain.sm{min-height:64px;font-size:14px}
.terms{display:grid;gap:8px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.terms .eyebrow{color:var(--accent)}
.terms dl{margin:0;display:grid;gap:8px}
.terms dl>div{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding-top:8px}
.terms dl>div:first-child{border-top:0;padding-top:0}
.terms dt{font:600 14px var(--body)}
.terms dd{margin:0;font-size:.92rem;color:var(--muted)}
@media (max-width:560px){.terms dl>div{grid-template-columns:minmax(0,1fr);gap:2px}}
.vid{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line);max-width:760px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidplay{all:unset;cursor:pointer;position:absolute;inset:0;display:grid;place-items:center}
.vidplay img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.88;transition:opacity .2s}
.vidplay:hover img,.vidplay:focus-visible img{opacity:1}
.vidplay:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.vidplay .pb{position:relative;width:68px;height:48px;border-radius:14px;background:rgba(15,15,15,.82);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.vidplay .pb::after{content:"";position:absolute;left:28px;top:14px;border-style:solid;border-width:10px 0 10px 17px;border-color:transparent transparent transparent #fff}
.vidplay:hover .pb{background:#e00}
.vidmeta{margin:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;font-size:.9rem;max-width:760px}
.vidnone{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;justify-items:start}
.vidnone p{margin:0;color:var(--muted);font-size:.92rem}
.recall,.predict{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 14px;display:grid;gap:8px}
.recall p,.predict p{margin:0;font-size:.92rem}
.recall .eyebrow,.predict .eyebrow{color:var(--accent)}
.mist{display:grid;gap:10px}
.mi{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mi>div{padding:12px 14px;display:grid;gap:4px;align-content:start}
.mi p{margin:0;font-size:.93rem}
.mi .w{background:var(--bad-soft)} .mi .w .eyebrow{color:var(--bad)}
.mi .r{background:var(--ok-soft)} .mi .r .eyebrow{color:var(--ok)}
@media (max-width:620px){.mi{grid-template-columns:minmax(0,1fr)}}
.tk{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.tk .tklist{display:none;margin:0;padding-left:20px;gap:8px}
.tk.open .tklist{display:grid}
.tk.open .tklock{display:none}
.tklock{display:grid;gap:10px;justify-items:start}
.tklock p{margin:0;color:var(--muted);font-size:.92rem}
.onpage{display:grid;gap:1px;font-size:.86rem;border-bottom:1px solid var(--line);padding-bottom:12px}
.onpage .eyebrow{margin-bottom:4px}
.onpage button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:4px 8px;border-radius:8px;color:var(--muted)}
.onpage button span{font:600 11px var(--mono)}
.onpage button:hover{background:var(--sunk);color:var(--ink)}
@media (max-width:900px){.onpage{display:none}}
.qact{gap:10px 14px}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.conf .cl{font:600 12px var(--mono);color:var(--muted);letter-spacing:.04em;margin-right:2px}
@media (max-width:560px){.conf .cl{flex-basis:100%}}
.conf.done .btn{opacity:.45}
.conf.done .btn.on{opacity:1;outline:2px solid var(--accent);outline-offset:1px}
.fb .cn{font-weight:600}
.calib{display:grid;gap:10px}
.calib .r{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:.9rem}
.calib .t{height:10px;border-radius:9px;background:var(--sunk);overflow:hidden}
.calib .t i{display:block;height:100%;background:var(--accent);border-radius:9px}
.calib .n{font:600 12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.vis{display:grid;gap:10px}
.vis h4{margin:0;font:600 14px var(--body)}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.flow li{flex:1 1 140px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;align-content:start;position:relative}
.flow li b{font:600 14px var(--body)}
.flow li span{font-size:.84rem;color:var(--muted)}
.flow li .sn{font:600 10px var(--mono);color:var(--accent)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.cmp{grid-template-columns:1fr}}
.cmp>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.cmp h5{margin:0 0 6px;font:700 15px var(--display)}
.cmp ul{margin:0;padding-left:18px;font-size:.9rem;display:grid;gap:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font:600 12px var(--mono);color:var(--muted);background:var(--surface2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
.bx{display:grid;gap:6px}
.bx div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;background:var(--surface)}
.bx div:nth-child(odd){background:var(--surface2)}
.bx b{font:600 13px var(--mono);color:var(--accent)}
.bx span{font-size:.9rem}
@media (max-width:520px){.bx div{grid-template-columns:1fr;gap:2px}}
.trace{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:640px){.trace{grid-template-columns:minmax(0,1fr)}}
.trace .side{display:grid;gap:10px}
.trace .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.trace .box .eyebrow{font-size:10px}
.vars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font:13px var(--mono)}
.vars .ch{color:var(--accent);font-weight:600}
.out{font:13px/1.5 var(--mono);white-space:pre-wrap;margin:0;min-height:1.5em;overflow-wrap:anywhere}
.trace .ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trace .ctl .pos{font:600 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:16px;min-width:0;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:9px;background:var(--sunk)}
.dots i.cur{background:var(--muted)}
.dots i.r{background:var(--ok)} .dots i.w{background:var(--bad)}
.qprompt{font:500 1.06rem/1.5 var(--body);margin:0}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);transition:border-color .15s,transform .15s}
.opt:hover{border-color:var(--accent);transform:translateX(2px)}
.opt .k{font:600 12px var(--mono);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--sunk)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt[disabled]{cursor:default}
.pred{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:14px var(--mono);background:var(--surface2);color:var(--ink)}
.pars{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--code-bg);padding:4px 4px 4px 0;cursor:pointer}
.pars li.sel{border-color:var(--accent);background:var(--accent-soft)}
.pars pre{margin:0;font:13.5px/1.5 var(--mono);white-space:pre;overflow-x:auto;padding:6px 12px}
.pars .mv{display:flex;gap:2px}
.pars .mv button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:7px;font:600 13px var(--mono);color:var(--muted)}
.pars .mv button:hover{background:var(--sunk);color:var(--ink)}
.pars.right li{border-color:var(--ok)} .pars.wrong li{border-color:var(--bad)}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:6px;animation:fade .25s}
.fb.r{background:var(--ok-soft)} .fb.w{background:var(--bad-soft)}
.fb b{font:700 15px var(--display)}
.fb.r b{color:var(--ok)} .fb.w b{color:var(--bad)}
.fb p{margin:0}
.fb pre{margin:0;font:13px var(--mono);white-space:pre-wrap}
.result{display:grid;gap:14px;justify-items:start}
.score{font:800 3.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.score.pass{color:var(--ok)} .score.fail{color:var(--bad)}
.ring{width:120px;height:120px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--body);transition:border-color .15s}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.lvcard{all:unset;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:6px;transition:border-color .15s,transform .2s}
.lvcard:hover{border-color:var(--accent);transform:translateY(-3px)}
.lvcard b{font:700 1.15rem var(--display)}
.lvcard span{font-size:.88rem;color:var(--muted)}
.lvcard .n{font:600 11px var(--mono)}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:400px){.projs{grid-template-columns:minmax(0,1fr)}}
.proj-card h4{margin:0;font:700 1.12rem/1.2 var(--display)}
.proj-card p{margin:0;font-size:.92rem}
ul.ms{list-style:none;margin:0;padding:0;display:grid;gap:2px}
ul.ms label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:6px 4px;cursor:pointer;font-size:.92rem;align-items:start}
ul.ms input{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
ul.ms input:checked+span{color:var(--muted);text-decoration:line-through}
.stretch{font-size:.86rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.principles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pr h4{margin:0;font:700 1.1rem/1.2 var(--display)}
.pr p{margin:0;font-size:.92rem}
.pr .ap{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.src{font-size:.8rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.str-strong{background:var(--ok-soft);color:var(--ok)} .str-moderate{background:var(--accent-soft);color:var(--accent)} .str-mixed{background:var(--summit-soft);color:var(--summit)}
.protocol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;counter-reset:s}
.protocol li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px;align-content:start}
.protocol li::before{counter-increment:s;content:"Step " counter(s);font:600 11px var(--mono);color:var(--accent);letter-spacing:.06em}
.protocol b{font:700 1.02rem var(--display)}
.protocol span{font-size:.9rem;color:var(--muted)}
.intervals{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}
.intervals div{display:grid;justify-items:center;gap:4px;font:600 11px var(--mono);color:var(--muted)}
.intervals i{display:block;width:34px;background:var(--grad);border-radius:5px 5px 0 0}
.empty{border:1.5px dashed var(--line2);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted);font:500 14px var(--mono)}
.loading::before{content:"";display:block;width:36px;height:36px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer button{all:unset;cursor:pointer;text-decoration:underline}
input.search{width:100%;max-width:340px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font:14px var(--body);background:var(--surface);color:var(--ink)}
select.sel{border:1px solid var(--line);border-radius:11px;padding:8px 10px;font:14px var(--body);background:var(--surface);color:var(--ink)}

/* editor widget */
.ed{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:grid;min-width:0;box-shadow:var(--shadow)}
.edbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.edlabel{font:500 12px var(--mono);color:var(--muted)}
.edsp{flex:1}
.edwrap{min-width:0}
.ed .CodeMirror{height:auto;background:var(--code-bg);color:var(--ink);font:13.5px/1.6 var(--mono)}
.ed .CodeMirror-scroll{min-height:96px;max-height:560px}
.ed.tall .CodeMirror-scroll{min-height:340px}
.ed .CodeMirror-gutters{background:var(--code-bg);border-right:1px solid var(--line)}
.ed .CodeMirror-linenumber{color:var(--muted);opacity:.7}
.ed .CodeMirror-cursor{border-left:2px solid var(--cursor)}
.ed .CodeMirror-selected,.ed .CodeMirror-focused .CodeMirror-selected,.ed .CodeMirror-line::selection,.ed .CodeMirror-line>span::selection,.ed .CodeMirror-line>span>span::selection{background:var(--sel)}
.ed .CodeMirror-focused{box-shadow:inset 0 0 0 2px var(--accent)}
.ed .CodeMirror-matchingbracket{color:var(--ink)!important;background:var(--sel);outline:1px solid var(--accent)}
.ed .cm-keyword{color:var(--syn-kw)} .ed .cm-string,.ed .cm-string-2{color:var(--syn-str)} .ed .cm-number,.ed .cm-atom{color:var(--syn-num)}
.ed .cm-comment{color:var(--syn-com);font-style:italic} .ed .cm-def{color:var(--syn-def)} .ed .cm-builtin{color:var(--syn-bi)}

.ed .cm-tag{color:var(--syn-kw)} .ed .cm-attribute{color:var(--syn-def)} .ed .cm-bracket{color:var(--muted)}
.ed .cm-error{color:var(--syn-err)}
.ed .CodeMirror pre.CodeMirror-line,.ed .CodeMirror pre.CodeMirror-line-like{font-variant-ligatures:none}
.edta{width:100%;min-height:160px;border:0;resize:vertical;padding:12px 14px;font:13.5px/1.6 var(--mono);background:var(--code-bg);color:var(--ink);tab-size:4}
.edin{display:grid;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface2)}
.edin textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.5 var(--mono);background:var(--surface);color:var(--ink);resize:vertical}
.edout{border-top:1px solid var(--line);background:var(--sunk)}
.edouthead{display:flex;justify-content:space-between;padding:8px 14px 0}
.edms{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.edpre{margin:0;padding:6px 14px 12px;font:13px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto}
.edpre .err{color:var(--syn-err)}
.edfoot{padding:6px 12px;border-top:1px solid var(--line);font:500 11px var(--mono);color:var(--muted)}
.qrun{margin-top:4px}
/* ---------- rewards: challenges, shop, leaderboard ---------- */
.coinh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.coinh svg.coin{width:.9em;height:.9em}
.coins{display:inline-flex;align-items:center;gap:5px;font:700 13px var(--mono);color:var(--med)}
.chals{display:grid;gap:8px}
.chal{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.chal .ci{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.chal.done .ci{background:var(--ok-soft);color:var(--ok)}
.chal .cb{display:grid;gap:5px;min-width:0}
.chal .cb b{font:600 14px var(--body);overflow-wrap:anywhere}
.chal .cm{font:500 11.5px var(--mono);color:var(--muted)}
.chal .bar{height:6px}
.chal.done .bar i{background:var(--ok)}
.chal .cr{display:flex;align-items:center;gap:8px}
@media (max-width:480px){.chal{grid-template-columns:30px minmax(0,1fr)}.chal .ci{width:30px;height:30px}.chal .cr{grid-column:2;justify-content:space-between}}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.shopc{display:grid;gap:12px;align-content:space-between;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.shopc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.shopc .sv{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sw,var(--accent-soft));color:var(--accent)}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lb li{display:grid;grid-template-columns:34px 34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}
.lb li:nth-child(odd){background:var(--surface2)}
.lb li.me{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.lb .rk{font:600 13px var(--mono);color:var(--muted);text-align:center}
.lb .medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--mono);color:#1b1300;justify-self:center}
.lb .m1{background:#fbbf24}.lb .m2{background:#cbd5e1}.lb .m3{background:#e0a46b}
.lb .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#0a0b1a;font:700 14px var(--display)}
.lb .nm{display:grid;min-width:0}.lb .nm b{overflow-wrap:anywhere}.lb .nm span{font-size:.8rem}
.lb .lvl{font:500 12px var(--mono);display:flex;align-items:center;gap:4px;white-space:nowrap}
.lb .val{font:700 13px var(--mono);white-space:nowrap}
