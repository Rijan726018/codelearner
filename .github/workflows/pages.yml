# Publishes the site to GitHub Pages on every push to main, then asks Vercel to rebuild codebay.org
# (the Rijan726018/codebay project copies this repository at build time).
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # codebay.org: set the repository secret VERCEL_DEPLOY_HOOK to the Deploy Hook URL from
      # Vercel → codebay project → Settings → Git → Deploy Hooks. Without it this step does nothing.
      - name: Rebuild codebay.org
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK not set; codebay.org updates on its next Vercel deploy."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Asked Vercel to rebuild codebay.org."
